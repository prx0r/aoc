hooks:
- text: Round workers — who chases the skips and the debt?
  angle: pain_callout
  audience: gardeners
- text: 'Paper round book: what happens if you lose it?'
  angle: risk
  audience: gardeners
- text: Streets know your van. Do lapsed streets hear from you?
  angle: recanvass
  audience: gardeners
- text: 'Before: paper. After: rounds recorded, debt chased.'
  angle: before_after
  audience: gardeners
- text: How many skips went unlogged this month?
  angle: diagnostic
  audience: gardeners
- text: Missed enquiry while on the round = lost round?
  angle: scenario
  audience: gardeners
- text: Just downloaded Muse? We'll set it up for your business for £20.
  angle: muse_setup
  audience: gardeners
- text: 'Round workers: your logins stay yours. Always.'
  angle: trust
  audience: gardeners
- text: 'Round workers: nothing sends without your approval — agreed?'
  angle: trust
  audience: gardeners
- text: More customers or fewer skips — which grows your round?
  angle: question_choice
  audience: gardeners
- text: 'Round workers: how many free cleans did unlogged skips give away?'
  angle: direct_callout
  audience: gardeners
- text: Still logging rounds on paper? One lost book = the whole round.
  angle: mistake_warning
  audience: gardeners
