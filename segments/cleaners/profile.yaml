id: cleaners
label: UK domestic cleaners — recurring plans, unbilled extras, chasing payments
pains:
- Paused plans don't restart themselves — that revenue leaks every month
- Travel, materials and deep-clean extras go unbilled on fixed prices
- Payment reminders, plan changes and rebooking eat owner time
- Quote follow-ups never happen
offer:
  price: £20 assisted setup (pilot)
  founding: £299 for first 3 (feedback + referral + case study)
  setup_time: ~1 hour remote; reminders + win-back lists day one
  includes: recurring schedule, enquiry form, approved reminder drafts, 7 days setup
    support, personalised Muse manual
  excluded: website build, live voice service, Meta production integration (separately
    quoted per OFFER.md)
  note: 'Muse is US-only as of Sep 2026, no confirmed UK date: build the UK waiting
    list now; take £20 only when the customer can access it. One priority workflow
    only (bookings, enquiries, quotations, or appointment admin per OFFER.md).'
close: DM CLEAN for £20 setup.
dm_keyword: CLEAN
workflow: Follow-ups, reminders, win-backs drafted — you approve everything
comparator: notebook + memory
tone: plain, respectful; talk recovered revenue, not software
competitor_note: Don't replace anything. Add follow-up + reminders + win-back.
