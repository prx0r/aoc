hooks:
- text: Cleaners — which paused plan would you win back first?
  angle: question_choice
  audience: cleaners
- text: Fixed prices, variable costs. Who's counting?
  angle: mechanism
  audience: cleaners
- text: Payments chased at 10pm. Again?
  angle: pain_callout
  audience: cleaners
- text: Paused plans don't restart themselves.
  angle: winback
  audience: cleaners
- text: 'Cleaners: before — chasing. After — reminders drafted.'
  angle: before_after
  audience: cleaners
- text: How much unbilled extras this month?
  angle: diagnostic
  audience: cleaners
- text: £310 a month for scheduling. Or £60. Same diary.
  angle: stack_cost
  audience: cleaners
- text: Paused, not cancelled. That's £500–2,000 a month walking back in.
  angle: retention
  audience: cleaners
- text: Reviews decide the Maps pack. Who asks for them?
  angle: review_engine
  audience: cleaners
- text: If this fails in 30 days, we change the plan. In writing.
  angle: kill_rule
  audience: cleaners
- text: Just downloaded Muse? We'll set it up for your business for £20.
  angle: muse_setup
  audience: cleaners
- text: 'Cleaners: we never ask for passwords. Ever.'
  angle: trust
  audience: cleaners
- text: 'Cleaners: your accounts stay yours. Always.'
  angle: trust
  audience: cleaners
- text: Cleaning doesn't burn you out. Chasing does — agree?
  angle: contrarian
  audience: cleaners
- text: Paused plans coming back — without a single phone call?
  angle: outcome_question
  audience: cleaners
- text: You can stop doing quotes at 9pm. Seriously.
  angle: permission
  audience: cleaners
