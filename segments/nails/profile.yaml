id: nails
label: UK nail technicians — independent/home-based, social-led enquiries, repeat
  infills
pains:
- Enquiries scattered across Instagram/TikTok/WhatsApp DMs, booked manually
- No-shows on long appointments cost materials + hours
- Infills have natural intervals but lapsed regulars are never rebooked
- Portfolio scattered across social posts, reviews rarely collected
offer:
  price: £20 assisted setup (pilot)
  founding: £299 for first 3 (feedback + referral + case study)
  setup_time: ~1 hour remote; booking-link + deposit prep day one
  includes: booking link, deposits, WhatsApp quick replies, appointment prompts, 7
    days setup support, personalised Muse manual
  excluded: website build, live voice service, Meta production integration (separately
    quoted per OFFER.md)
  note: 'Muse is US-only as of Sep 2026, no confirmed UK date: build the UK waiting
    list now; take £20 only when the customer can access it.'
close: DM NAILS for £20 setup.
dm_keyword: NAILS
workflow: Booking-link triage, deposit + reminder prep — you approve every send
comparator: DM chaos
tone: warm, visual, peer-to-peer; talk fully-booked columns, not software
competitor_note: Don't replace Booksy/Fresha. Add triage + deposits + rebooking on
  top.
