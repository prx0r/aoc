hooks:
- text: Groomers — how much commission on YOUR regulars?
  angle: pain_callout
  audience: dog_groomers
- text: Dogs need grooms every 6 weeks. Who reminds owners?
  angle: mechanism
  audience: dog_groomers
- text: Waiting list in your head or on a list?
  angle: diagnostic
  audience: dog_groomers
- text: 'Groomers: before — marketplace fees. After — direct repeats.'
  angle: before_after
  audience: dog_groomers
- text: 'Groomers: lapsed owners aren''t gone — just unscheduled?'
  angle: winback
  audience: dog_groomers
- text: Behaviour flags live in memory. Risky, no?
  angle: safety
  audience: dog_groomers
- text: Wag takes 40% of the walk. The dog still needs walking.
  angle: marketplace_tax
  audience: dog_groomers
