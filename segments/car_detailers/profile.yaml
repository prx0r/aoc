  founding: £299 for first 3 (feedback + referral + case study)
  setup_time: ~1 hour remote; quote-triage + booking setup day one
  includes: photo-led enquiry form, package pricing, scheduling, 7 days setup support,
    personalised Muse manual
  excluded: website build, live voice service, Meta production integration (separately
    quoted per OFFER.md)
  note: 'Muse is US-only as of Sep 2026, no confirmed UK date: build the UK waiting
    list now; take £20 only when the customer can access it. One priority workflow
    only (bookings, enquiries, quotations, or appointment admin per OFFER.md).'
close: DM DETAIL for £20 setup.
